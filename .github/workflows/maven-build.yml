name: Build Maven Project

on:
  push:
    branches: [ upgrade ]
  pull_request:
    branches: [ upgrade ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto' # or 'zulu', 'corretto', etc.
          java-version: '25'

      - name: Build with Maven
        run: mvn -B package --file pom.xml
